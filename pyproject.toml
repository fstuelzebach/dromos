[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dromos"
version = "0.1.0"
description = "Open tools to extract running data from Garmin and Coros, build tidy datasets, and visualise training."
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer==0.27.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
dromos = "dromos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
